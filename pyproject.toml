[project]
name = "coinerp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "django-axes>=9.0.0",
    "django-datatable",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-otp>=1.7.5",
    "django-q2>=1.11.1",
    "django-simple-history>=3.13.0",
    "django-tailwind-cli>=4.8.2",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "qrcode>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "core", "apps"]

[tool.uv.sources]
django-datatable = { git = "https://github.com/saurabhtiki/django-datatable" }
