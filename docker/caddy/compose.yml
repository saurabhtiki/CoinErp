# The front door (HTTPS) for production and sandbox. Start it AFTER both app projects have started once
# (it reads their static-files volumes):
#   docker compose -p coinerp-edge -f docker/caddy/compose.yml up -d
# Settings: copy .env.edge.example to .env.edge and fill it in.
name: coinerp-edge

services:
  caddy:
    image: caddy:2-alpine
    env_file: ../../.env.edge
    # Host network (Linux server): Caddy owns ports 80/443 and reaches the apps on this machine's 127.0.0.1.
    # (The apps listen on 127.0.0.1 only, which a normal Docker network cannot reach on Linux.)
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - prod_static:/srv/static-prod:ro
      - sandbox_static:/srv/static-sandbox:ro
      - caddy_data:/data  # certificates: keep this, or Let's Encrypt limits are hit
      - caddy_config:/config
    restart: unless-stopped

volumes:
  prod_static:
    external: true
    name: coinerp-prod_static
  sandbox_static:
    external: true
    name: coinerp-sandbox_static
  caddy_data:
  caddy_config:
