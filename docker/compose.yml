# One file runs both servers. Each server has its own env file, project name and ports:
#
#   Production:
#     docker compose -p coinerp-prod --env-file .env.prod -f docker/compose.yml up -d --build
#   Sandbox (test copy with fake data):
#     docker compose -p coinerp-sandbox --env-file .env.sandbox -f docker/compose.yml up -d --build
#
# The project name (-p) gives each server its own database and uploaded-files volumes.
# --env-file sets ENV_FILE and WEB_PORT below (see .env.prod.example / .env.sandbox.example).
# Without any of this, `docker compose -f docker/compose.yml up -d --build` uses ../.env on port 8000.
# HTTPS is done by Caddy, a separate project: docker/caddy/compose.yml.

services:
  db:
    image: postgres:17
    env_file: ${ENV_FILE:-../.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ${ENV_FILE:-../.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"  # only this machine; Caddy (HTTPS) is the public door
    volumes:
      - media:/app/private_media
      - backups:/app/backups
      - static:/app/staticfiles  # CSS/JS, served by Caddy
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Background jobs (emails, later WhatsApp and reports). Same image as web.
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "manage.py", "qcluster"]
    env_file: ${ENV_FILE:-../.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media:/app/private_media
      - backups:/app/backups
    depends_on:
      - web  # web runs the migrations first
    restart: unless-stopped


volumes:
  pgdata:
  media:
  backups:  # backup zip files
  static:
