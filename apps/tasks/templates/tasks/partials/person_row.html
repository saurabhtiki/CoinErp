<tr>
  <td data-dt-col="first_name" class="dt-sticky font-medium">{{ row.get_full_name|default:row.email }}</td>
  <td data-dt-col="open_count" class="text-right"><a href="{{ person_urls.open }}&person={{ row.pk }}" class="link link-hover" title="Tasks not yet completed. Click to see them.">{{ row.open_count }}</a></td>
  <td data-dt-col="overdue_count" class="text-right{% if row.overdue_count %} text-error font-medium{% endif %}"><a href="{{ person_urls.overdue }}&person={{ row.pk }}" class="link link-hover" title="Open tasks whose due date has passed. Click to see them.">{{ row.overdue_count }}</a></td>
  <td data-dt-col="done_count" class="text-right"><a href="{{ person_urls.done }}&person={{ row.pk }}" class="link link-hover" title="Tasks completed since the 1st of this month. Click to see them.">{{ row.done_count }}</a></td>
  <td data-dt-col="on_time_percent" class="text-right" title="{{ row.on_time_count }} of {{ row.done_count }} completed by the due date">{% if row.on_time_percent is None %}–{% else %}{{ row.on_time_percent }}%{% endif %}</td>
</tr>
