{% load tailwind_cli %}<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · Group ERP</title>
  {% tailwind_css %}
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <main class="card bg-base-100 w-full max-w-sm shadow-sm">
    <div class="card-body">
      <p class="text-sm font-semibold text-base-content/60">Group ERP</p>
      <h1 class="card-title text-2xl">{% block heading %}{% endblock %}</h1>
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
