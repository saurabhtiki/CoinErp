{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center gap-2 mb-4">
  <h1 class="text-2xl font-bold flex-1">{{ title }}</h1>
  {% if can_edit %}
    <a href="{% url add_url_name %}" class="btn btn-primary btn-sm" title="Add a new record in the admin screen">Add</a>
  {% endif %}
</div>
<div role="tablist" class="tabs tabs-box mb-4 overflow-x-auto flex-nowrap">
  {% for slug, master in master_lists.items %}
    <a role="tab" href="{% url 'masters:list' slug %}" class="tab whitespace-nowrap{% if master.title == title %} tab-active{% endif %}" title="Show {{ master.title|lower }}">{{ master.title }}</a>
  {% endfor %}
</div>
{% include "masters/partials/table.html" %}
{% endblock %}
