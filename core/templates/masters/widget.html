<div class="grid grid-cols-2 gap-2">
  {% for item in data.counts %}
    <a href="{% url 'masters:list' item.slug %}" class="rounded-box bg-base-200 p-3 hover:bg-base-300" title="Show {{ item.title|lower }}">
      <div class="text-xs text-base-content/70">{{ item.title }}</div>
      <div class="text-2xl font-bold">{{ item.count }}</div>
    </a>
  {% endfor %}
</div>
