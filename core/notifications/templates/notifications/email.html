{# One layout for every Coin email. Inline styles only: mail apps ignore <style> blocks and classes. #}
<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#1f2937">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden">
        <tr><td style="background:#1e3a5f;color:#ffffff;padding:14px 24px;font-size:18px;font-weight:bold">Coin</td></tr>
        <tr><td style="padding:24px">
          <p style="margin:0 0 12px;font-size:15px">Hello {{ name }},</p>
          <p style="margin:0 0 16px;font-size:17px;font-weight:bold">{{ title }}</p>
          {% for block in blocks %}
            {% if block.rows %}
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e5e7eb;border-radius:6px;margin:0 0 16px;font-size:14px">
                {% for label, value in block.rows %}
                  <tr>
                    <td style="padding:8px 12px;color:#6b7280;width:120px;vertical-align:top;border-bottom:1px solid #f3f4f6">{{ label }}</td>
                    <td style="padding:8px 12px;vertical-align:top;border-bottom:1px solid #f3f4f6">{{ value }}</td>
                  </tr>
                {% endfor %}
              </table>
            {% else %}
              <p style="margin:0 0 16px;font-size:14px;line-height:1.5">{{ block.text|linebreaksbr }}</p>
            {% endif %}
          {% endfor %}
          {% if link_url %}
            <p style="margin:8px 0 20px">
              <a href="{{ link_url }}" style="display:inline-block;background:#1e3a5f;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:bold">Open in Coin</a>
            </p>
          {% endif %}
          <p style="margin:0;font-size:14px">Regards,<br>Coin</p>
        </td></tr>
        <tr><td style="padding:14px 24px;background:#f9fafb;color:#9ca3af;font-size:12px">
          You get this email because you are part of this in Coin. Reply in Coin, not to this email.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
